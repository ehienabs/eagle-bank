apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "eagle-bank.fullname" . }}
  labels:
    {{- include "eagle-bank.labels" . | nindent 4 }}
data:
  # Application configuration
  APP_NAME: {{ .Values.config.app.name | quote }}
  APP_ENVIRONMENT: {{ .Values.config.app.environment | quote }}

  # Server configuration
  SERVER_PORT: {{ .Values.config.server.port | quote }}
  SERVER_READ_TIMEOUT: {{ .Values.config.server.readTimeout | quote }}
  SERVER_WRITE_TIMEOUT: {{ .Values.config.server.writeTimeout | quote }}
  SERVER_IDLE_TIMEOUT: {{ .Values.config.server.idleTimeout | quote }}
  SERVER_RATE_LIMIT_RPS: {{ .Values.config.server.rateLimitRPS | quote }}
  SERVER_RATE_LIMIT_BURST: {{ .Values.config.server.rateLimitBurst | quote }}

  # Database configuration
  DATABASE_HOST: {{ .Values.externalServices.database.host | quote }}
  DATABASE_PORT: {{ .Values.externalServices.database.port | quote }}
  DATABASE_NAME: {{ .Values.externalServices.database.database | quote }}
  DATABASE_SSLMODE: {{ .Values.externalServices.database.sslMode | quote }}
  DATABASE_MAX_OPEN_CONNS: {{ .Values.externalServices.database.maxOpenConns | quote }}
  DATABASE_MAX_IDLE_CONNS: {{ .Values.externalServices.database.maxIdleConns | quote }}

  # Kafka configuration
  KAFKA_BROKERS: {{ join "," .Values.externalServices.kafka.brokers | quote }}
  KAFKA_TOPIC_EVENTS: {{ .Values.externalServices.kafka.topicEvents | quote }}
  KAFKA_CONSUMER_GROUP: {{ .Values.externalServices.kafka.consumerGroup | quote }}

  # Logger configuration
  LOGGER_LEVEL: {{ .Values.config.logger.level | quote }}
  LOGGER_FORMAT: {{ .Values.config.logger.format | quote }}

  # Metrics configuration
  METRICS_ENABLED: {{ .Values.config.metrics.enabled | quote }}

  # Tracing configuration
  TRACING_ENABLED: {{ .Values.config.tracing.enabled | quote }}
  TRACING_OTLP_ENDPOINT: {{ .Values.externalServices.tracing.otlpEndpoint | quote }}
  TRACING_SAMPLE_RATE: {{ .Values.config.tracing.sampleRate | quote }}

  {{- with .Values.extraConfigMap }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
