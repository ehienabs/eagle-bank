global:
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    monitor: 'eagle-bank'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Eagle Bank API
  - job_name: 'eagle-bank-api'
    scrape_interval: 10s
    static_configs:
      - targets: ['api:8080']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\d+'
        replacement: '${1}'
