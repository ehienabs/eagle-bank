apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eagle-bank-prod
  namespace: argocd
  labels:
    app.kubernetes.io/name: eagle-bank
    app.kubernetes.io/instance: production
    app.kubernetes.io/part-of: eagle-bank
    environment: production
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: eagle-bank-alerts
    notifications.argoproj.io/subscribe.on-sync-failed.slack: eagle-bank-alerts
    notifications.argoproj.io/subscribe.on-health-degraded.slack: eagle-bank-alerts
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: eagle-bank

  source:
    repoURL: https://github.com/ehienabs/eagle-bank.git
    targetRevision: main
    path: helm/eagle-bank

    helm:
      releaseName: eagle-bank-prod
      valueFiles:
        - values.yaml
      values: |
        replicaCount: 3

        config:
          app:
            environment: production
          logger:
            level: info
            format: json
          tracing:
            sampleRate: 0.1
          server:
            rateLimitRPS: 200
            rateLimitBurst: 400

        autoscaling:
          enabled: true
          minReplicas: 3
          maxReplicas: 20
          targetCPUUtilizationPercentage: 60
          targetMemoryUtilizationPercentage: 70

        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 256Mi

        podDisruptionBudget:
          enabled: true
          minAvailable: 2

        ingress:
          enabled: true
          className: nginx
          annotations:
            kubernetes.io/tls-acme: "true"
            nginx.ingress.kubernetes.io/rate-limit: "200"
            nginx.ingress.kubernetes.io/rate-limit-window: "1m"
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
          hosts:
            - host: api.eagle-bank.io
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: eagle-bank-prod-tls
              hosts:
                - api.eagle-bank.io

        networkPolicy:
          enabled: true

        serviceMonitor:
          enabled: true

        externalServices:
          database:
            host: postgresql-prod.database.svc.cluster.local
            sslMode: require
            maxOpenConns: 50
            maxIdleConns: 10
          kafka:
            brokers:
              - kafka-prod-0.kafka-prod.kafka.svc.cluster.local:9092
              - kafka-prod-1.kafka-prod.kafka.svc.cluster.local:9092
              - kafka-prod-2.kafka-prod.kafka.svc.cluster.local:9092
          tracing:
            otlpEndpoint: jaeger-collector.observability.svc.cluster.local:4317

        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - eagle-bank
                topologyKey: kubernetes.io/hostname

        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: eagle-bank

  destination:
    server: https://kubernetes.default.svc
    namespace: eagle-bank-prod

  # Manual sync required for production
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

  revisionHistoryLimit: 10

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
