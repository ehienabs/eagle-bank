apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eagle-bank
  namespace: argocd
  labels:
    app.kubernetes.io/name: eagle-bank
    app.kubernetes.io/part-of: eagle-bank
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/ehienabs/eagle-bank.git
    targetRevision: HEAD
    path: helm/eagle-bank

    helm:
      releaseName: eagle-bank
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: eagle-bank

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
